<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hypertension AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #1769aa;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .bubble {
            background: #1769aa;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: #eef3f8;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #ddd;
        }

        #question {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        #question:focus {
            border-color: #1769aa;
        }

        #sendBtn {
            padding: 0 25px;
            border: none;
            border-radius: 12px;
            background: #1769aa;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #sendBtn:hover {
            background: #125789;
        }

        #sendBtn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .typing {
            font-style: italic;
            color: #777;
        }

        .sources {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .source-item {
            margin-top: 5px;
        }

        @media (max-width: 600px) {

            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h1>Hypertension AI Assistant</h1>
        <p>Ask questions based on the provided medical documents</p>
    </div>

    <div class="messages" id="messages">

        <div class="message bot">
            <div class="bubble">
                Hello! 👋<br><br>
                I am the Hypertension AI Assistant.
                You can ask me questions about hypertension
                based on the medical documents.
            </div>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask a question about hypertension..."
            autocomplete="off"
        >

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>


<script>

const questionInput = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");


function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.innerHTML = text;

    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}


async function sendQuestion() {

    const question = questionInput.value.trim();

    if (!question) {
        return;
    }

    addMessage(question, "user");

    questionInput.value = "";

    sendBtn.disabled = true;

    addMessage(
        '<span class="typing">Thinking...</span>',
        "bot"
    );

    try {

        const response = await fetch("/ask", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })

        });

        const data = await response.json();

        // Remove "Thinking..."
        const botMessages =
            document.querySelectorAll(".message.bot");

        const lastBotMessage =
            botMessages[botMessages.length - 1];

        lastBotMessage.remove();


        let answer = data.answer || "No answer received.";

        answer = answer.replace(/\n/g, "<br>");


        addMessage(answer, "bot");


        // Display sources if available

        if (data.sources && data.sources.length > 0) {

            const sourceHTML = data.sources
                .map(source => `
                    <div class="source-item">
                        📄 Page ${source.page}
                        ${source.section
                            ? "- " + source.section
                            : ""}
                    </div>
                `)
                .join("");

            const sourceMessage =
                document.createElement("div");

            sourceMessage.className = "message bot";

            sourceMessage.innerHTML = `
                <div class="bubble sources">
                    <strong>Sources:</strong>
                    ${sourceHTML}
                </div>
            `;

            messages.appendChild(sourceMessage);

            messages.scrollTop = messages.scrollHeight;
        }

    } catch (error) {

        console.error(error);

        const botMessages =
            document.querySelectorAll(".message.bot");

        const lastBotMessage =
            botMessages[botMessages.length - 1];

        lastBotMessage.remove();

        addMessage(
            "Sorry, something went wrong. Please try again.",
            "bot"
        );

    }

    sendBtn.disabled = false;

    questionInput.focus();
}


sendBtn.addEventListener(
    "click",
    sendQuestion
);


questionInput.addEventListener(
    "keypress",
    function(event) {

        if (event.key === "Enter") {
            sendQuestion();
        }

    }
);

</script>

</body>
</html>
